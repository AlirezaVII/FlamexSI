services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      FALMEX_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${FALMEX_API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${FALMEX_API_PORT:-8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
