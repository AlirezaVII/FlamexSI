[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "falmex"
version = "0.1.0"
description = "Falmex — AI-assisted discovery engine for NASA microgravity combustion data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pytz",  # needed by duckdb to return TIMESTAMPTZ values
    "openpyxl>=3.1",
    "pyyaml>=6",
    "google-genai>=1.0",
    "opencv-python-headless>=4.9",  # flame footage (falmex.vision)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "matplotlib>=3.8",  # reproducible review plots only
    "pymupdf>=1.24",  # optional published-vector extraction
    "statsmodels>=0.14",  # clustered compositional sensitivity models
    "scikit-learn>=1.5",  # date-grouped prediction checks
]

[tool.setuptools.packages.find]
include = ["falmex*"]

[tool.setuptools.package-data]
falmex = [
    "config/*.yaml",
    "datasets/*.csv",
    "knowledge/*.json",
    "review_artifacts/*.json",
    "review_artifacts/compositional/*",
    "review_artifacts/replication/*",
    "review_artifacts/review/*",
    "review_artifacts/time_series/*",
    "review_artifacts/uncertainty/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
