[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "falmex"
version = "0.1.0"
description = "Falmex — AI-assisted discovery engine for NASA microgravity combustion data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pytz",  # needed by duckdb to return TIMESTAMPTZ values
    "openpyxl>=3.1",
    "pyyaml>=6",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["falmex*"]

[tool.setuptools.package-data]
falmex = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
