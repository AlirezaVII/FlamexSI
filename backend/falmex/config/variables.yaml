# Canonical variable schema.
#
# This is the ONLY place that knows what the columns of an incoming file mean.
# When the real NASA data arrives, extend/adjust this file (aliases, units,
# roles) instead of changing pipeline code.
#
# role:  id | condition (experiment input) | outcome (flame behavior) | meta
# type:  numeric | categorical | boolean | text
# unit:  canonical unit; values in other units are converted via `units`
# relevance: optional ranking weight for an outcome (default 1.0 = neutral). Leave it neutral
#        until the real data shows which outcomes matter most for the fire-safety question.
#
# These variables only describe the synthetic TEST data. Columns in a real file that are not
# listed here are kept unchanged (never dropped) and can still be filtered, compared and used
# in a discovery goal.

variables:
  experiment_id:
    role: id
    type: text
    aliases: [experiment, exp_id, test_id, run_id, experiment_number, flex_test]

  oxygen:
    role: condition
    type: numeric
    unit: percent_o2
    description: Ambient oxygen concentration (mole/volume fraction, %)
    aliases: [o2, oxygen_concentration, oxygen_percent, o2_percent, xo2,
              o_initial_ambient_composition_mole_fraction]
    units:
      fraction: {scale: 100.0}
      mole fraction: {scale: 100.0}

  pressure:
    role: condition
    type: numeric
    unit: kPa
    description: Ambient pressure
    aliases: [ambient_pressure, p, pressure_kpa]
    units:
      atm: {scale: 101.325}
      psi: {scale: 6.894757}
      bar: {scale: 100.0}
      Pa: {scale: 0.001}
      mmHg: {scale: 0.133322368}

  flow_rate:
    role: condition
    type: numeric
    unit: cm_per_s
    description: Imposed flow / ventilation velocity
    aliases: [flow, flow_velocity, air_flow, velocity]
    units:
      m_per_s: {scale: 100.0}
      mm_per_s: {scale: 0.1}

  temperature:
    role: condition
    type: numeric
    unit: K
    description: Initial / ambient temperature
    aliases: [temp, ambient_temperature, initial_temperature]
    units:
      C: {scale: 1.0, offset: 273.15}

  material:
    role: condition
    type: categorical
    description: Fuel / sample material
    aliases: [fuel, sample, sample_material, fuel_type]

  gravity:
    role: condition
    type: numeric
    unit: g0
    description: Gravity level relative to Earth (1.0 = 1 g)
    aliases: [g_level, gravity_level, g]
    units:
      m_per_s2: {scale: 0.1019716}

  flame_length:
    role: outcome
    type: numeric
    unit: cm
    description: Flame length / size
    aliases: [flame_size, flame_height]
    units:
      mm: {scale: 0.1}
      m: {scale: 100.0}

  burning_rate:
    role: outcome
    type: numeric
    unit: mm_per_s
    description: Burning / flame spread rate
    aliases: [burn_rate, spread_rate, flame_spread_rate, regression_rate]
    units:
      cm_per_s: {scale: 10.0}

  burn_time:
    role: outcome
    type: numeric
    unit: s
    description: Burn duration
    aliases: [burn_duration, burning_time, burn_time_s]

  extinction:
    role: outcome
    type: boolean
    description: Whether the flame extinguished
    aliases: [extinguished, flame_extinction, extinct]

  ignition:
    role: outcome
    type: boolean
    description: Whether ignition occurred
    aliases: [ignited, ignition_success]

  # ---- NASA PSI-69 Flame Extinguishment Experiment (FLEX) ----
  flex_identifier:
    role: meta
    type: text
    description: NASA FLEX test identifier; distinct from the unique numeric test number

  test_date:
    role: meta
    type: text
    description: FLEX test date as reported by NASA

  test_gmt:
    role: meta
    type: text
    description: FLEX test time as reported by NASA

  nitrogen_fraction:
    role: condition
    type: numeric
    unit: mole_fraction
    description: Initial ambient nitrogen mole fraction
    aliases: [n_initial_ambient_composition_mole_fraction]

  carbon_dioxide_fraction:
    role: condition
    type: numeric
    unit: mole_fraction
    description: Initial ambient carbon dioxide mole fraction (CO in the PSI export header)
    aliases: [co_initial_ambient_composition_mole_fraction]

  helium_fraction:
    role: condition
    type: numeric
    unit: mole_fraction
    description: Initial ambient helium mole fraction
    aliases: [he_initial_ambient_composition_mole_fraction]

  initial_droplet_diameter:
    role: condition
    type: numeric
    unit: mm
    description: Initial droplet diameter D0
    aliases: [droplet_initial_diameter_mm]

  visible_extinction_diameter:
    role: outcome
    type: numeric
    unit: mm
    description: Droplet diameter De at visible flame extinction
    aliases: [visible_flame_extinction_diameter_mm]

  droplet_burning_rate_constant:
    role: outcome
    type: numeric
    unit: mm2_per_s
    description: Average burning-rate constant K from a linear fit of D² versus time; not mm/s
    aliases: [burning_rate_mm]

  test_end:
    role: meta
    type: categorical
    description: FLEX test endpoint; Extinction, Disruption and Completion remain distinct

  burn_time_original:
    role: meta
    type: text
    description: Original burn-time value, including any approximation marker

  burn_time_approximate:
    role: meta
    type: boolean
    description: Whether NASA marked burn time as approximate with a tilde

  ambient_pressure_raw_mmhg:
    role: meta
    type: numeric
    unit: mmHg
    description: Original reported pressure, retained when the analysis pressure is invalidated

  pressure_quality:
    role: meta
    type: categorical
    description: Pressure validity flag; non-positive values are excluded only from pressure analyses

  test_end_extinction_versus_completion:
    role: outcome
    type: boolean
    description: True=Extinction, False=Completion, missing=Disruption; not a universal extinction label

  extinction_diameter_ratio:
    role: outcome
    type: numeric
    unit: dimensionless
    description: Derived De/D0 when both diameters are available and D0 is positive

  d2_law_residual_mm2:
    role: meta
    type: numeric
    unit: mm2
    description: Endpoint QC residual D0²-De²-K*tb; not an independent measurement

  d2_law_normalized_residual:
    role: meta
    type: numeric
    unit: dimensionless
    description: Endpoint QC residual divided by D0²; quasi-steady assumptions may not hold

  # ---- measured from flame footage by falmex.vision (Footage page) ----
  flame_circularity:
    role: outcome
    type: numeric
    description: Circularity 4πA/P² of the projected flame outline (1 = circle), median over flame frames. A proxy for sphericity.

  flame_growth_rate:
    role: outcome
    type: numeric
    unit: mm_per_s
    description: Growth rate dR/dt of the equivalent flame radius, from calibrated footage

  flame_extinction_radius:
    role: outcome
    type: numeric
    unit: mm
    description: Equivalent flame radius at the last frame before the flame went out (calibrated footage)

  flame_blue_fraction:
    role: outcome
    type: numeric
    description: Share of saturated flame pixels with a blue hue (uncalibrated camera; chromatic proxy)

  flame_soot_blue_ratio:
    role: outcome
    type: numeric
    description: Yellow-orange-red (soot-like) to blue flame pixels (uncalibrated camera; chromatic proxy)
