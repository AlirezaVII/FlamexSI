[project]
name = "flamexsi-v6"
version = "1.0.0"
description = "Pouya Latifiyan's frozen v6 flame finder as a web service for FlamexSI"
requires-python = "==3.12.*"
# Pinned to the versions the frozen v6 model was trained and verified with (bass-cv/requirements.txt)
dependencies = [
  "numpy==2.2.5",
  "opencv-python-headless==4.12.0.88",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "lightgbm==4.6.0",
]

[tool.vercel]
entrypoint = "api.predict:handler"
